[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bitki-ekg"
version = "0.1.0"
description = "İnsan EKG'sinden bitkiye: biyosinyal temel modelleri ile su stresi tespiti"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
